# AICTE IntelliScrutiny — demonstration prototype (synthetic data only).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: intelliscrutiny
      POSTGRES_USER: intelliscrutiny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliscrutiny -d intelliscrutiny"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://intelliscrutiny:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/intelliscrutiny
      STORAGE_DIR: /app/data/storage
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - storage:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  storage:
